services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: graduation-db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Huy@1135Password!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      - db
    entrypoint: >
      /bin/bash -c "
      echo 'Dang cho SQL Server san sang...';
      until /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P 'Huy@1135Password!' -C -Q 'SELECT 1' &> /dev/null; do
        sleep 2;
      done;
      echo 'Tao Database GraduationDB neu chua co...';
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P 'Huy@1135Password!' -C -Q 'IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = \"GraduationDB\") CREATE DATABASE GraduationDB;';
      echo 'GraduationDB da san sang!';
      "

  backend:
    image: phantranxuanhuy/graduation-management:latest
    container_name: graduation-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://db:1433;databaseName=GraduationDB;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=Huy@1135Password!
      - JAVA_TOOL_OPTIONS=-Xmx300m -Xms128m
    mem_limit: 512m
    mem_reservation: 256m

volumes:
  mssql_data:

